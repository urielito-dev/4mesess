<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Color oscuro tipo noche */
            color: #f8fafc;
            text-align: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .tarjeta {
            max-width: 500px;
            background-color: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #fb7185; /* Rosa suave */
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .cancion {
            margin-top: 30px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>¡Felices 4 Meses! ❤️</h1>
        <p>Aunque estemos lejos, la distancia no significa nada cuando tú significas tanto para mí.</p>
        <p>Cada día que pasa es un día menos para volver a abrazarnos. Quería hacerte este pequeño detalle para recordarte lo mucho que te quiero.</p>
        
        <div class="cancion">
            <!-- REPRODUCTOR DE SPOTIFY -->
            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/4uLU6hMCjMI75M1A2tKUQC?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
        
        <p><strong>Gracias por estos 4 meses increíbles.</strong></p>
    </div>
</body>
</html>
