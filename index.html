<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Felices 4 meses ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="cielo">
        <canvas id="estrellas"></canvas>
    </div>

    <div class="contenedor">

        <div class="corazon-contenedor">
            <svg class="corazon-svg" viewBox="0 0 100 100" id="corazon">

                <defs>
                    <clipPath id="clipCorazon">
                        <path d="M50 90 L10 50
                                 C-5 30 10 5 30 8
                                 C40 9 47 15 50 25
                                 C53 15 60 9 70 8
                                 C90 5 105 30 90 50
                                 Z"/>
                    </clipPath>
                </defs>

                <rect
                    id="rellenoCorazon"
                    x="0"
                    y="100"
                    width="100"
                    height="0"
                    fill="#ff1744"
                    clip-path="url(#clipCorazon)"
                />

                <path
                    d="M50 90 L10 50
                       C-5 30 10 5 30 8
                       C40 9 47 15 50 25
                       C53 15 60 9 70 8
                       C90 5 105 30 90 50
                       Z"
                    class="borde-corazon"
                />

            </svg>
        </div>

        <h1 id="titulo">Felices 4 meses</h1>

        <button id="boton">
            Presiona para verlo amorcito ❤️
        </button>

        <div id="carga-contenedor">

            <div class="barra-fondo">
                <div class="barra" id="barra"></div>
            </div>

            <div id="porcentaje">
                0%
            </div>

        </div>

        <div id="final">
            ❤️
        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
